<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Rivers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<style>
  html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  body, #map { background: #e3edf2; }
  /* 3D globe: black space with stars (the map canvas is transparent around the globe) */
  html.space body, html.space #map { background: #000; }
  .star-sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
  html.space .star-sky { display: block; }

  /* 2D / 3D switch: two buttons, the active one is filled */
  .mode-switch { display: flex; }
  .mode-switch button {
    width: auto; height: 32px; padding: 0 12px;
    font: 600 13px/32px system-ui, sans-serif; color: #33434d;
  }
  .mode-switch button + button { border-top: 0; border-left: 1px solid #ddd; }
  .mode-switch button[aria-pressed="true"] { background: #2f6690; color: #fff; cursor: default; }
  .mode-switch button[aria-pressed="false"]:hover { background: #eef3f6; }

  /* Pressed look for all map buttons (+, -, compass, 2D/3D): darker, sunken, icon shrinks.
     `.pressed` is set from JS so that even a quick tap shows it for a moment. */
  .maplibregl-ctrl-group button:not(:disabled):not([aria-pressed="true"]):active,
  .maplibregl-ctrl-group button.pressed {
    background: #c9d9e4;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.35);
  }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { transition: scale 80ms; }

  /* Scale bar at the bottom, centred horizontally: a ruler with 10 divisions (the middle
     tick longer); semi-transparent; readable on the black space and on the light 2D map;
     clicks pass through */
  .maplibregl-ctrl-scale.scale-center {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 2;
    pointer-events: none; box-sizing: border-box; text-align: center; white-space: nowrap;
    margin: 0; padding: 2px 6px 11px;
    background: rgba(255, 255, 255, 0.6); color: #33434d;
    border: 2px solid #33434d; border-top: none; border-radius: 0 0 3px 3px;
    font: 600 12px/16px system-ui, sans-serif;
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08);
  }
  .scale-center .tick { position: absolute; bottom: 0; width: 1px; height: 5px; background: #33434d; transform: translateX(-50%); }
  .scale-center .tick.mid { width: 2px; height: 9px; }

  /* Compass: same hand pointer as + and - (MapLibre gives it `grab` because it can also be dragged) */
  .maplibregl-ctrl-group button.maplibregl-ctrl-compass,
  .maplibregl-ctrl-group button.maplibregl-ctrl-compass .maplibregl-ctrl-icon { cursor: pointer; }
  .maplibregl-ctrl-group button:not(:disabled):active .maplibregl-ctrl-icon,
  .maplibregl-ctrl-group button.pressed .maplibregl-ctrl-icon {
    scale: 0.82; /* `scale`, not `transform`: the compass rotates its icon with an inline transform */
  }
</style>
</head>
<body>
<div id="map"></div>
<script type="module">
  import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';

  const BACKGROUND = '#e3edf2';

  // Tiles live next to this file: {z}/{x}/{y}.jpg (native zoom 0-7, zoomed further by scaling).
  // Tile URLs must be absolute (they are fetched from a web worker), so prefix this page's folder.
  const tileUrl = new URL('.', location.href).href + '{z}/{x}/{y}.jpg';

  // Mode from the address: #flat opens the 2D map, anything else the globe
  const modeFromHash = () => (location.hash === '#flat' ? 'flat' : 'globe');
  let mode = modeFromHash();

  const CENTER = [35, 31.5]; // Israel

  // South polar cap for the globe. The tiles stop at 85.05 S; MapLibre fills the cap
  // beyond by stretching each pixel of the tiles' last row to the pole, which shows as a
  // streaky fan. Cover it with ice colour (sampled from the tiles), fading in from 82 S
  // through thin bands so there is no visible edge. The Arctic edge is plain sea, no fix needed.
  const ICE = '#e7e4dd';
  const MERCATOR_EDGE = 85.051129;
  function southCap(fadeFrom = 82, steps = 24) {
    const band = (lat1, lat2) => {
      const ring = [];
      for (let lon = -180; lon <= 180; lon += 10) ring.push([lon, -lat1]);
      for (let lon = 180; lon >= -180; lon -= 10) ring.push([lon, -lat2]);
      ring.push(ring[0]);
      return ring;
    };
    const features = [];
    for (let i = 0; i < steps; i++) {
      const t = (i + 1) / steps; // 0..1 towards the edge
      const lat1 = fadeFrom + (MERCATOR_EDGE - fadeFrom) * i / steps;
      const lat2 = fadeFrom + (MERCATOR_EDGE - fadeFrom) * t;
      features.push({
        type: 'Feature',
        properties: { opacity: t * t * (3 - 2 * t) }, // smoothstep
        geometry: { type: 'Polygon', coordinates: [band(lat1, lat2)] }
      });
    }
    return { type: 'FeatureCollection', features };
  }

  // Start zoom for the globe: the globe's outline fills `fill` of the shorter screen side.
  // MapLibre draws the globe with radius R = 512 * 2^zoom / (2 pi cos(lat)) px, seen by a
  // camera 1.5 * screen height away (default 36.87 deg field of view), so its outline has
  // radius r = D tan(asin(R / (D + R))). Solved for zoom:
  function globeFitZoom(fill = 0.9) {
    const el = document.getElementById('map');
    const D = 1.5 * el.clientHeight;
    const r = fill * Math.min(el.clientWidth, el.clientHeight) / 2;
    const s = Math.sin(Math.atan(r / D));
    const R = D * s / (1 - s);
    const worldSize = 2 * Math.PI * Math.cos(CENTER[1] * Math.PI / 180) * R;
    const zoom = Math.log2(worldSize / 512);
    // A page opened in a hidden/background tab can have a 0x0 map at this point: 0/0 gives
    // NaN, which crashes MapLibre. Fall back to a fixed zoom then.
    return Number.isFinite(zoom) ? Math.max(0, zoom) : 1;
  }

  // MapLibre zoom is one step lower than Leaflet's for the same scale
  // (it counts 512 px per world at zoom 0, Leaflet 256 px).
  // Old page: zoom 1-9, start 2  ->  here: zoom 0-8; the flat map starts at 1.
  const map = new maplibregl.Map({
    container: 'map',
    center: CENTER,
    zoom: mode === 'globe' ? globeFitZoom() : 1,
    minZoom: 0,
    maxZoom: 8,
    // One world only. On the flat map this also stops panning past the edges of the
    // Mercator square (+-180 lon, +-85.05 lat) and zooming out further than the screen.
    // (No maxBounds: in MapLibre 6.11.2 bounds reaching +-180 lon crash the map.)
    renderWorldCopies: false,
    // No attribution box: Natural Earth is public domain (credited in the repo README instead)
    attributionControl: false,
    style: {
      version: 8,
      projection: { type: mode === 'flat' ? 'mercator' : 'globe' },
      // No atmosphere halo around the globe (MapLibre draws one unless this is 0)
      sky: { 'atmosphere-blend': 0 },
      sources: {
        rivers: {
          type: 'raster',
          tiles: [tileUrl],
          tileSize: 256,
          minzoom: 0,
          maxzoom: 7
        },
        southCap: { type: 'geojson', data: southCap() }
      },
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': BACKGROUND } },
        { id: 'rivers', type: 'raster', source: 'rivers', paint: { 'raster-fade-duration': 0 } },
        {
          id: 'south-cap', type: 'fill', source: 'southCap',
          layout: { visibility: mode === 'globe' ? 'visible' : 'none' }, // the flat map has no fan
          paint: { 'fill-color': ICE, 'fill-opacity': ['get', 'opacity'], 'fill-antialias': false }
        }
      ]
    }
  });

  // --- 2D / 3D switch -------------------------------------------------------
  class ModeSwitch {
    onAdd() {
      this._container = document.createElement('div');
      this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group mode-switch';
      this._buttons = {};
      for (const [key, text, title] of [
        ['flat', '2D', 'Flat map'],
        ['globe', '3D', 'Globe']
      ]) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = text;
        b.addEventListener('click', () => setMode(key));
        this._buttons[key] = b;
        b.dataset.title = title;
        this._container.appendChild(b);
      }
      this.update();
      return this._container;
    }
    update() {
      for (const [key, b] of Object.entries(this._buttons)) {
        const active = key === mode;
        b.setAttribute('aria-pressed', String(active));
        b.title = active ? `${b.dataset.title} (current view)` : `Switch to ${b.dataset.title.toLowerCase()}`;
      }
    }
    onRemove() { this._container.remove(); }
  }
  const modeSwitch = new ModeSwitch();

  // The projection can only change once the style has loaded; a click before that
  // is remembered in `mode` and applied on 'load'.
  let styleLoaded = false;
  const applyProjection = () => {
    map.setProjection({ type: mode === 'flat' ? 'mercator' : 'globe' });
    map.setLayoutProperty('south-cap', 'visibility', mode === 'globe' ? 'visible' : 'none');
    updateSpace();
  };
  map.on('load', () => { styleLoaded = true; applyProjection(); });

  function setMode(newMode, { updateHash = true } = {}) {
    if (newMode === mode) return;
    mode = newMode;
    if (styleLoaded) applyProjection();
    modeSwitch.update();
    if (updateHash) history.replaceState(null, '', '#' + mode);
  }

  // Back/forward or an edited address switches too
  window.addEventListener('hashchange', () => setMode(modeFromHash(), { updateHash: false }));

  map.addControl(modeSwitch, 'top-right');
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
  // Scale bar with a fixed length; the distance label changes instead. (MapLibre's own
  // ScaleControl only shows round distances, so its bar halves or doubles in length at every
  // 500 -> 1000 km type step, which looked like jumping while dragging.)
  // Placed at the bottom centre of the screen (user's request); it gives the scale at the centre
  // of the view. 400 px wide, or narrower on small screens (16 px margin each side), with ten
  // divisions; the label is the distance across the whole bar.
  const SCALE_MAX_PX = 400;
  const scaleBar = document.createElement('div');
  scaleBar.className = 'maplibregl-ctrl-scale scale-center';
  const scaleLabel = document.createElement('span');
  scaleBar.appendChild(scaleLabel);
  for (let i = 1; i < 10; i++) {
    const tick = document.createElement('div');
    tick.className = i === 5 ? 'tick mid' : 'tick';
    // i tenths of the full bar: offsets are measured inside the 2 px side borders, so correct for them
    tick.style.left = `calc(${i * 10}% + ${0.4 * i - 2}px)`;
    scaleBar.appendChild(tick);
  }
  map.getContainer().appendChild(scaleBar);
  function updateScale() {
    const c = map.getContainer(), x = c.clientWidth / 2, y = c.clientHeight / 2;
    const barPx = Math.max(100, Math.min(SCALE_MAX_PX, c.clientWidth - 32));
    scaleBar.style.width = barPx + 'px';
    // Metres per pixel at the centre of the view, measured over a short 10 px stretch (a long
    // stretch could run off the edge of a small globe), times the bar's length
    const m = map.unproject([x - 5, y]).distanceTo(map.unproject([x + 5, y])) / 10 * barPx;
    const [value, unit] = m >= 1000 ? [m / 1000, 'km'] : [m, 'm'];
    scaleLabel.textContent = `${Number(value.toPrecision(2)).toLocaleString('en')} ${unit}`;
  }
  map.on('move', updateScale);
  map.on('resize', updateScale);
  updateScale();
  // Full-screen on/off (browsers allow it only from a click/tap; Esc also leaves).
  // Only where the browser supports it: iPhones do not allow a page to go full screen,
  // so the button is left out there (iPads, Android and desktop get it).
  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
    map.addControl(new maplibregl.FullscreenControl(), 'top-right');
  }

  // --- Star sky (3D globe only) -----------------------------------------------
  // Real stars from the Yale Bright Star Catalog (stars.json, made by scripts/make_stars.py:
  // flat [ra, dec, magnitude, B-V, ...], faint first). They are drawn on a canvas behind the
  // map, at their true directions for the current sidereal time, so the sky turns with the
  // globe and stays put when zooming (stars are infinitely far away).
  const STAR_SIZE = 1.5;        // overall star size; raise for an even brighter sky
  const SPIKES_BELOW_MAG = 1.5; // stars brighter than this get light spikes

  const skyCanvas = document.createElement('canvas');
  skyCanvas.className = 'star-sky';
  map.getContainer().insertBefore(skyCanvas, map.getContainer().firstChild); // under the map canvas
  const sky = skyCanvas.getContext('2d');

  function updateSpace() {
    document.documentElement.classList.toggle('space', mode === 'globe');
    scheduleSky();
  }

  // Star colour from B-V index (blue-white hot stars to orange cool ones), one glow sprite per colour
  const STAR_COLOURS = [[-0.3, '155,178,255'], [0.0, '202,216,255'], [0.3, '244,243,255'], [0.6, '255,242,224'],
                        [0.9, '255,224,188'], [1.2, '255,204,153'], [1.6, '255,176,112']];
  const sprites = STAR_COLOURS.map(([, rgb]) => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.18, `rgba(${rgb},1)`);
    grad.addColorStop(0.45, `rgba(${rgb},0.3)`);
    grad.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    return c;
  });
  const colourIndex = (bv) => {
    let best = 0;
    STAR_COLOURS.forEach(([v], i) => { if (Math.abs(bv - v) < Math.abs(bv - STAR_COLOURS[best][0])) best = i; });
    return best;
  };

  let stars = null; // unit vectors in the celestial frame + how to draw each star
  fetch('stars.json').then((r) => r.json()).then((flat) => {
    const n = flat.length / 4, rad = Math.PI / 180;
    stars = { x: new Float32Array(n), y: new Float32Array(n), z: new Float32Array(n), size: new Float32Array(n),
              alpha: new Float32Array(n), sprite: new Uint8Array(n), mag: new Float32Array(n) };
    for (let i = 0; i < n; i++) {
      const ra = flat[4 * i] * rad, dec = flat[4 * i + 1] * rad, mag = flat[4 * i + 2], bv = flat[4 * i + 3];
      stars.x[i] = Math.cos(dec) * Math.cos(ra); stars.y[i] = Math.cos(dec) * Math.sin(ra); stars.z[i] = Math.sin(dec);
      // Glow diameter in px: grows gently with brightness (Sirius about 8x a faint star)
      stars.size[i] = STAR_SIZE * (3 + 3.2 * Math.pow(10, -0.2 * (mag - 6.5)) ** 0.75);
      stars.alpha[i] = Math.min(1, Math.max(0.75, 1.25 - 0.08 * mag)); // "super bright": faint stars stay visible
      stars.sprite[i] = colourIndex(bv);
      stars.mag[i] = mag;
    }
    scheduleSky();
  });

  // Greenwich mean sidereal time (radians): how far the sky has turned relative to the Earth
  const gmst = () => {
    const jd = Date.now() / 86400000 + 2440587.5;
    return ((280.46061837 + 360.98564736629 * (jd - 2451545.0)) % 360) * Math.PI / 180;
  };

  function drawSky() {
    const W = skyCanvas.clientWidth, H = skyCanvas.clientHeight, dpr = window.devicePixelRatio || 1;
    if (skyCanvas.width !== Math.round(W * dpr) || skyCanvas.height !== Math.round(H * dpr)) {
      skyCanvas.width = Math.round(W * dpr); skyCanvas.height = Math.round(H * dpr);
    }
    sky.setTransform(dpr, 0, 0, dpr, 0, 0);
    sky.clearRect(0, 0, W, H);
    if (mode !== 'globe' || !stars || !W || !H) return;

    // Camera axes, the same as MapLibre's globe camera (checked against map.project to 0.01 px):
    // looking down at the centre point, screen up = north turned by the bearing, tilted by the pitch.
    const rad = Math.PI / 180, c = map.getCenter();
    const lat = c.lat * rad, lon = c.lng * rad, b = map.getBearing() * rad, p = map.getPitch() * rad;
    const n = [Math.cos(lat) * Math.cos(lon), Math.cos(lat) * Math.sin(lon), Math.sin(lat)];
    const E = [-Math.sin(lon), Math.cos(lon), 0];
    const N = [-Math.sin(lat) * Math.cos(lon), -Math.sin(lat) * Math.sin(lon), Math.cos(lat)];
    const lin = (a, s, v, t) => [a[0] * s + v[0] * t, a[1] * s + v[1] * t, a[2] * s + v[2] * t];
    const u = lin(N, Math.cos(b), E, Math.sin(b));
    const right = lin(E, Math.cos(b), N, -Math.sin(b));
    const fwd = lin(n, -Math.cos(p), u, Math.sin(p));
    const up = lin(u, Math.cos(p), n, Math.sin(p));
    // Earth-fixed -> celestial frame: turn about the pole by the sidereal time
    const t = gmst(), ct = Math.cos(t), st = Math.sin(t);
    const cel = (v) => [v[0] * ct - v[1] * st, v[0] * st + v[1] * ct, v[2]];
    const [rx, ry, rz] = cel(right), [ux, uy, uz] = cel(up), [fx, fy, fz] = cel(fwd);
    const focal = 1.5 * H; // MapLibre's default 36.87 deg vertical field of view

    sky.globalCompositeOperation = 'lighter';
    const { x, y, z, size, alpha, sprite, mag } = stars;
    for (let i = 0; i < x.length; i++) {
      const dz = x[i] * fx + y[i] * fy + z[i] * fz;
      if (dz <= 0.05) continue; // behind the camera
      const sx = W / 2 + (x[i] * rx + y[i] * ry + z[i] * rz) / dz * focal;
      const sy = H / 2 - (x[i] * ux + y[i] * uy + z[i] * uz) / dz * focal;
      const s = size[i];
      if (sx < -s || sy < -s || sx > W + s || sy > H + s) continue;
      sky.globalAlpha = alpha[i];
      sky.drawImage(sprites[sprite[i]], sx - s / 2, sy - s / 2, s, s);
      if (mag[i] < SPIKES_BELOW_MAG) { // light spikes on the brightest stars
        const len = s * 1.6;
        sky.globalAlpha = 0.55;
        for (const [dx, dy] of [[len, 0], [0, len]]) {
          const g = sky.createLinearGradient(sx - dx, sy - dy, sx + dx, sy + dy);
          g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
          sky.strokeStyle = g; sky.lineWidth = 1;
          sky.beginPath(); sky.moveTo(sx - dx, sy - dy); sky.lineTo(sx + dx, sy + dy); sky.stroke();
        }
      }
    }
    sky.globalAlpha = 1;
    sky.globalCompositeOperation = 'source-over';
  }

  // Redraw at most once per frame whenever the map moves or resizes
  let skyQueued = false;
  function scheduleSky() {
    if (skyQueued) return;
    skyQueued = true;
    requestAnimationFrame(() => { skyQueued = false; drawSky(); });
  }
  map.on('move', scheduleSky);
  map.on('resize', scheduleSky);
  updateSpace();

  // Press feedback: keep the pressed look for at least 150 ms, so a quick tap is visible too
  map.getContainer().addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.maplibregl-ctrl-group button');
    if (!b || b.disabled || b.getAttribute('aria-pressed') === 'true') return;
    b.classList.add('pressed');
    const t0 = performance.now();
    const release = () => {
      window.removeEventListener('pointerup', release);
      window.removeEventListener('pointercancel', release);
      setTimeout(() => b.classList.remove('pressed'), Math.max(0, 150 - (performance.now() - t0)));
    };
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
  });

  window.map = map; // for poking at the map from the browser console
</script>
</body>
</html>
