<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Rivers</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>
<style>
  html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  body { background: #e3edf2; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map', {
    minZoom: 1,
    maxZoom: 9,
    worldCopyJump: false,
    maxBounds: [[-85.06, -180], [85.06, 180]],
    maxBoundsViscosity: 1.0
  }).setView([30, 20], 2);

  // Tiles live next to this file: {z}/{x}/{y}.jpg (native zoom 0-7, zoomed further by scaling)
  L.tileLayer('{z}/{x}/{y}.jpg', {
    minZoom: 0,
    maxNativeZoom: 7,
    maxZoom: 9,
    noWrap: true,
    attribution: 'Made with Natural Earth'
  }).addTo(map);
</script>
</body>
</html>
